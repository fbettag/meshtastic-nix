[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-nix"
version = "0.1.1"
description = "Reconcile declarative Meshtastic profiles over the local TCP API"
requires-python = ">=3.11"
dependencies = ["meshtastic>=2.7.11,<2.8", "protobuf>=5"]
license = "GPL-3.0-only"

[project.scripts]
meshtastic-nix = "meshtastic_nix:main"

[tool.setuptools]
py-modules = ["meshtastic_nix"]
